<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->

    <!-- Google Fonts: Sora, Poppins, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pathpilot.ai/" />
    <meta property="og:title" content="PATHPILOT | Discover Your Future. Build Your Career with AI." />
    <meta property="og:description" content="AI-powered career guidance platform for students. AI assessments, personalized roadmaps, resume builders & expert mentorship." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />

    <meta property="twitter:description" content="AI-powered career guidance platform for students." />
    <meta property="twitter:image" content="https://pathpilot.ai/og-image.jpg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "PATHPILOT",
        "operatingSystem": "Web Browser",
        "applicationCategory": "EducationalApplication",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "AI-powered career guidance platform for students providing assessments, roadmaps, resume building, and college recommendations.",
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.9",
          "ratingCount": "12500"
        }
      }
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 font-inter antialiased selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
