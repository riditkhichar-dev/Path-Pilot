<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)"/>
  
  <!-- Stylized P Road Arch -->
  <path d="M 42,175 L 42,105 C 42,55 78,25 118,25 C 158,25 174,58 174,88 C 174,120 146,142 118,142 L 86,142" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Sweeping Road -->
  <path d="M 40,178 C 65,162 88,135 118,110 C 145,88 165,70 178,54" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <path d="M 152,44 L 184,48 L 172,78 Z" fill="white"/>

  <!-- Road Center Dashed Markings -->
  <path d="M 45,178 C 68,162 90,135 120,110 C 146,88 166,70 177,55" stroke="#0B1736" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round"/>

  <!-- Compass Star -->
  <g transform="translate(108, 80)">
    <path d="M 0,-34 L 7,-8 L 0,-12 Z" fill="#F97316"/>
    <path d="M 0,-34 L -7,-8 L 0,-12 Z" fill="#EA580C"/>
    <path d="M 0,30 L 7,8 L 0,10 Z" fill="#0F172A"/>
    <path d="M 0,30 L -7,8 L 0,10 Z" fill="#1E293B"/>
    <path d="M 32,0 L 8,7 L 10,0 Z" fill="#1E293B"/>
    <path d="M 32,0 L 8,-7 L 10,0 Z" fill="#0F172A"/>
    <path d="M -32,0 L -8,7 L -10,0 Z" fill="#0F172A"/>
    <path d="M -32,0 L -8,-7 L -10,0 Z" fill="#1E293B"/>
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
  </g>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
</svg>
